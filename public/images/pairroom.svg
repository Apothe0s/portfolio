<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#14131a"/><g font-family="Arial,sans-serif"><rect x="35" y="30" width="18" height="28" rx="7" fill="#c6b4f8" transform="rotate(-18 35 30)"/><rect x="49" y="36" width="18" height="28" rx="7" fill="#9986ca" transform="rotate(-18 49 36)"/><text x="83" y="58" fill="#eeeaf5" font-weight="bold" font-size="27">PairRoom.</text><path d="M0 90H1200" stroke="#34303e"/><text x="73" y="149" fill="#a291bc" font-size="11" letter-spacing="3">TWO PEOPLE. ONE GOOD IDEA.</text><text x="68" y="242" fill="#eeeaf5" font-size="86">Better,</text><text x="68" y="333" fill="#d9c9f7" font-size="86" font-family="Georgia" font-style="italic">together.</text><g fill="#8f859f" font-size="17"><text x="72" y="392">A focused room for the work that clicks.</text><text x="72" y="422">Talk it through. Share your screen.</text><text x="72" y="452">Build something good.</text></g><circle cx="136" cy="553" r="45" fill="#392942" stroke="#635279"/><circle cx="350" cy="553" r="45" fill="#25372b" stroke="#3e665b"/><text x="123" y="564" fill="#d7c1f0" font-size="30">A</text><text x="338" y="564" fill="#b6e1ce" font-size="30">B</text><path d="M197 553H290" stroke="#50415e" stroke-dasharray="3 8"/><rect x="635" y="133" width="490" height="482" rx="13" fill="#1c1923" stroke="#39313f"/><text x="669" y="177" fill="#9a87b0" font-size="10" letter-spacing="2">YOUR NEXT SESSION STARTS HERE</text><text x="668" y="224" fill="#eeeaf5" font-size="25">Make room for a good idea.</text><text x="669" y="255" fill="#82738f" font-size="14">Bring a partner. We’ll bring the workspace.</text><g fill="#af9fc0" font-size="13"><text x="669" y="302">Your display name</text><text x="669" y="393">Session title</text></g><g fill="#15121c" stroke="#393040"><rect x="669" y="317" width="422" height="49" rx="5"/><rect x="669" y="408" width="422" height="49" rx="5"/></g><text x="686" y="348" fill="#eeeaf5" font-size="14">Angelito</text><text x="686" y="439" fill="#eeeaf5" font-size="14">A little room to build</text><rect x="669" y="483" width="422" height="49" rx="5" fill="#c6b4f8"/><text x="830" y="514" fill="#352345" font-size="15">Create a room →</text><text x="755" y="575" fill="#685975" font-size="11">Two participants · Rooms last 24 hours</text><path d="M70 660H1126" stroke="#302637"/><text x="73" y="696" fill="#62536e" font-size="10" letter-spacing="2">LESS FRICTION. MORE FLOW.</text></g></svg>