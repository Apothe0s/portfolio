<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f5ef"/><g font-family="Arial,sans-serif"><path d="M44 33l18-7 18 7v21c-3 10-10 17-18 20-8-3-15-10-18-20z" fill="none" stroke="#2d5641" stroke-width="3"/><text x="92" y="59" font-size="26" font-weight="bold" fill="#1f342c">HeaderWatch</text><path d="M0 96H1200" stroke="#d9dfd4"/><text x="78" y="156" font-size="11" fill="#627c6b" letter-spacing="3">THE SMALL DETAILS. THE BIG DIFFERENCE.</text><g fill="#1f342c" font-size="63"><text x="74" y="236">Know what your</text><text x="74" y="307">headers say.</text></g><text x="78" y="349" fill="#718176" font-size="17">Inspect the response. Understand the gaps. Take the next step.</text><circle cx="976" cy="243" r="100" fill="none" stroke="#bdcdbc"/><circle cx="976" cy="243" r="70" fill="none" stroke="#bdcdbc"/><path d="M939 218l37-14 37 14v44c-5 23-20 37-37 43-17-6-32-20-37-43z" fill="none" stroke="#54795e" stroke-width="3"/><path d="M957 253l14 14 26-30" fill="none" stroke="#54795e" stroke-width="3"/><rect x="75" y="391" width="1050" height="147" rx="8" fill="#e9eee3" stroke="#cbd7c5"/><text x="100" y="425" font-size="11" letter-spacing="2" fill="#546d58">01 / INSPECT A WEBSITE</text><rect x="98" y="444" width="1003" height="64" rx="5" fill="#fafbf7" stroke="#cad4c6"/><text x="123" y="483" fill="#97a293" font-size="17">Enter a website URL, e.g. github.com</text><rect x="902" y="451" width="190" height="50" rx="4" fill="#2d5641"/><text x="924" y="481" fill="#f4f8ef" font-size="15">Inspect headers →</text><g fill="#1f342c" font-size="18"><text x="78" y="599">Look beneath the surface.</text><text x="444" y="599">Make sense of the details.</text><text x="808" y="599">Keep a record.</text></g><g fill="#7c897b" font-size="14"><text x="78" y="627">Read the headers your server returns.</text><text x="444" y="627">Six checks. Clear next steps.</text><text x="808" y="627">History and report exports.</text></g><path d="M76 664H1124" stroke="#d9dfd4"/></g></svg>